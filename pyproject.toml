[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevworks"
version = "0.1.0"
description = "Decision models (SemIf, Kumo Tabular, Clef-Flash) served as Hopsworks model deployments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "transformers>=4.51,<6",
  "accelerate>=1.0",
]

[project.optional-dependencies]
deploy = ["hopsworks", "pytest"]

[tool.setuptools.packages.find]
include = ["jevworks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
