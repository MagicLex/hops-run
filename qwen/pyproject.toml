[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semif"
version = "0.1.0"
description = "SemIf direct logit readout engine, vendored for the qwen pilot's Hopsworks deployment"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "transformers>=4.51,<6",
  "accelerate>=1.0",
]

[project.optional-dependencies]
test = ["hopsworks", "pytest"]

[tool.setuptools.packages.find]
include = ["semif*"]
